# Runs every test on GitHub's Windows machines after each push, so a broken
# change shows a red cross on GitHub before it is pulled to the PC.
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
